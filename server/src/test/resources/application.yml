spring:
  datasource:
    url: jdbc:h2:mem:lighthouse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  jwt:
    secret: integration-test-secret-long-enough-0123456789
    expiration-seconds: 3600
  websocket:
    outbound-capacity: 16
    inbound-capacity: 16
